# tileWin theme: Windows 2000: the classic look of Windows 95 with the
# warmer grey of its 3D face, title bars fading from navy to light blue, the
# plain blue desktop it came with and Tahoma everywhere.
inherit win95

name "Windows 2000"
style win95

wallpaper {
	type solid
	color #3a6ea5
}

icons {
	theme hicolor
	set win95
}

decoration {
	title_font "Tahoma, MS Sans Serif, Noto Sans Bold 8"
	face #d4d0c8
	highlight #ffffff
	light #d4d0c8
	shadow #808080
	dark #404040
	active {
		title_gradient "0:#0a246a 1:#a6caf0"
		title_fg #ffffff
	}
	inactive {
		title_gradient "0:#808080 1:#c0c0c0"
		title_fg #d4d0c8
	}
}

panel {
	bg #d4d0c8
	border_top #d4d0c8
	border_top2 #ffffff
}

taskbar {
	bg #d4d0c8
	active_bg #e8e6e2
}

menu {
	bg #d4d0c8
	hl_bg #0a246a
	disabled_fg #808080
}

flyout {
	bar #0a246a
}

startmenu {
	banner_gradient "0:#000000 1:#0a246a"
}

alttab {
	bg #d4d0c8
	selection #0a246a
}

dark {
	decoration {
		active { title_gradient "0:#0a246a 1:#3a6ea5" }
		inactive { title_gradient "0:#3c3c3c 1:#5a5a5a" }
	}
}
