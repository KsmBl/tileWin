client.unfocused        #45475a #1e1e2e #6c7086 #45475a   #45475a
client.urgent           #e05252 #1e1e2e #cdd6f4 #e05252   #e05252
client.placeholder      #45475a #1e1e2e #6c7086 #45475a   #45475a
client.background       #1e1e2e
