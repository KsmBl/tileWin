# tileWin theme: Sway
# The look of a sway desktop with waybar: dark Catppuccin-like colors, 3px
# lavender borders with gaps in tile mode, a floating bar with rounded groups
# and colored widgets, GoMono Nerd Font.

name "Sway"
style win11

wallpaper {
	type image
	image /usr/share/backgrounds/ArchWallpaper.png
	mode fill
	color #1e1e2e
}

icons {
	theme breeze
}

decoration {
	top_height 30
	maximized_top_height 28
	border_width 3
	frame_width 3
	corner_radius 10
	grab_margin 8
	button_width 42
	title_font "GoMono Nerd Font, Noto Sans 10"
	shadow #00000060
	active {
		title_bg #1e1e2e
		title_fg #cdd6f4
		frame #7287fd
		glyph #cdd6f4
	}
	inactive {
		title_bg #1e1e2e
		title_fg #6c7086
		frame #45475a
		glyph #6c7086
	}
	button {
		hover #ffffff14
		pressed #ffffff0a
	}
	close {
		hover #e05252
		pressed #c04444
	}
}

panel {
	height 44
	# floating bar with a rounded background per group, like waybar
	margin 20
	groups yes
	group_bg #0e1120eb
	group_border #5b8fff38
	group_radius 14
	group_inset 3
	group_padding 6
	font "GoMono Nerd Font, Noto Sans 10"
	bold_font "GoMono Nerd Font, Noto Sans Bold 10"
	fg #dde3f5
	alignment left
	style fluent
}

taskbar {
	icons_only yes
	button_width 40
	fg #dde3f5
	active_fg #ffffff
	hover_bg #ffffff0f
	active_bg #5b8fff2e
	indicator #5b8fff
	indicator_inactive #6c7086
	indicator_height 3
	indicator_style pill
}

workspaces {
	style pill
	radius 12
	inset 6
	fg #dde3f5
	active_fg #ffffff
	active_bg #5b8fff2e
	hover_bg #ffffff0f
	urgent_bg #f8717138
	urgent_fg #fca5a5
}

start {
	style win11
	width 44
	fg #dde3f5
	hover_bg #ffffff0f
}

search {
	width 220
	bg #ffffff0d
	hover_bg #ffffff14
	fg #a6adc8
	glyph #cdd6f4
	label "Search"
}

tray {
	icons symbolic
	style flat
}

clock {
	format "  %H:%M  󰃭 %d"
	tooltip_format "%A, %B %d %Y"
	align center
	fg #e2e8f0
}

# widget colors and formats of the waybar config
cpu { fg #7eb8f7; format "󰍛  {usage}%" }
memory { fg #a78bfa; format "󰘚  {used}G" }
volume { fg #f9a8d4; format "{volume}%" }
battery { fg #86efac; format "{capacity}%" }
brightness { fg #fde68a }
network { fg #7dd3fc }

menu {
	font "GoMono Nerd Font, Noto Sans 10"
	bg #0e1120f5
	fg #dde3f5
	hl_bg #5b8fff33
	hl_fg #ffffff
	disabled_fg #6c7086
	border #5b8fff40
	separator #ffffff1a
	field_bg #1e1e2e
	field_fg #dde3f5
	radius 12
	item_height 30
	icon_size 16
}

startmenu {
	layout centered
	width 640
	height 680
	radius 14
	bg #0e1120f2
	fg #dde3f5
	header_fg #dde3f5
	hl_bg #5b8fff2e
	hl_fg #ffffff
	search_bg #1e1e2e
	search_fg #a6adc8
	search_border #5b8fff40
	footer_bg #0a0c18f2
	border #5b8fff38
}

tooltip {
	font "GoMono Nerd Font, Noto Sans 10"
	bg #0a0c18f5
	fg #dde3f5
	border #5b8fff40
}

alttab {
	font "GoMono Nerd Font, Noto Sans 10"
	bg #0e1120f0
	fg #dde3f5
	selection #5b8fff40
	border #5b8fff38
	radius 14
}

taskview {
	bg #0a0c18d8
	fg #dde3f5
	accent #7287fd
	hover #ffffff14
	radius 12
}

osd {
	bg #0e1120f2
	fg #dde3f5
	accent #7287fd
	border #5b8fff40
}

snap {
	color #7287fd40
}
