# tileWin theme: Windows XP (Luna blue)

name "Windows XP"
style winxp

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #5a9be8
}

icons {
	# fallback for icons the theme does not draw itself (icons/)
	theme hicolor
	set winxp
}

decoration {
	top_height 30
	maximized_top_height 26
	border_width 4
	corner_radius 8
	grab_margin 3
	title_font "Trebuchet MS, Noto Sans Bold 10"
	active {
		title_gradient "0:#3d8df5 0.06:#0a66f7 0.14:#0055e9 0.45:#0058ee 0.72:#005ef4 0.88:#0463f8 0.95:#0851db 1:#0842c1"
		title_fg #ffffff
		title_shadow #0a1883
		frame #0831d9
		frame_dark #001ea0
		frame_light #166aee
	}
	inactive {
		title_gradient "0:#a8c1f0 0.1:#7e9ae2 0.5:#7c97e0 0.9:#8ea8e6 1:#7c93d6"
		title_fg #d8e4f8
		frame #7b97e0
	}
}

panel {
	height 30
	font "Tahoma, Noto Sans 8"
	bold_font "Tahoma, Noto Sans Bold 8"
	bg_gradient "0:#3168d5 0.05:#4993e6 0.12:#2157d7 0.9:#2663e0 1:#1941a5"
	fg #ffffff
	alignment left
	padding 0
	style luna
}

taskbar {
	icons_only no
	button_width 160
	button_style luna
	radius 3
	fg #ffffff
	active_fg #ffffff
	bg_gradient "0:#3c81f3 0.5:#3574ee 1:#2d6ae6"
	hover_gradient "0:#53a0ff 0.5:#4a8ffb 1:#4282f5"
	active_gradient "0:#1e52b7 0.5:#1f4fb2 1:#2459c6"
	border #1a48b0
}

start {
	style xp
	label "start"
	width 100
	font "Franklin Gothic Medium, Trebuchet MS, Noto Sans Black Italic 13"
	fg #ffffff
	# taken row by row from the real one: a dark line on top, a glossy band,
	# then darker towards the bottom
	bg_gradient "0:#3a833a 0.04:#56a256 0.08:#89be8b 0.12:#82bc82 0.16:#70b070 0.2:#5fa85d 0.27:#4ca04b 0.35:#47a247 0.5:#45a045 0.7:#3a933a 0.85:#329032 0.93:#2b7f2b 1:#226633"
	hover_gradient "0:#4a934a 0.04:#66b266 0.08:#99ce9b 0.12:#92cc92 0.16:#80c080 0.2:#6fb86d 0.27:#5cb05b 0.35:#57b257 0.5:#55b055 0.7:#4aa34a 0.85:#42a042 0.93:#3b8f3b 1:#2e7640"
	pressed_gradient "0:#1e5a1e 0.1:#2e7a2e 0.3:#3a8a3a 0.6:#3b933c 0.85:#2f842f 1:#226c22"
}

tray {
	style xp
	bg_gradient "0:#0c59b9 0.05:#18a0f4 0.12:#1290e8 0.9:#0d8de5 1:#0a62c3"
	border #1047a8
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Tahoma, Noto Sans 8"
	bg #ffffff
	fg #000000
	hl_bg #316ac5
	hl_fg #ffffff
	disabled_fg #aca899
	border #8a867a
	sidebar #fcfcf9
	radius 0
	item_height 22
	icon_size 16
}

# The flyouts of the taskbar widgets (CPU, memory, network, ...). Keys left
# out are those of menu.
flyout {
	bg #ffffff
	fg #000000
	disabled_fg #6f6f6f
	border #0831d9
	radius 7
	# the blue Luna frame of the windows and the Start menu
	frame_width 4
	frame_gradient "0:#3a8ef3 0.1:#2468d4 0.9:#1e5bc0 1:#1848a8"
	inner_border #7a96df
	accent #316ac5
	link #1c52b8
	bar #2fb52f
	chart_bg #000000
	chart_grid #008040
	chart_line #00ff00
	chart_radius 0
}

startmenu {
	layout twocolumn
	width 380
	height 470
	radius 7
	header_gradient "0:#1868ce 0.1:#3a8ef3 0.9:#2468d4 1:#1e5bc0"
	header_fg #ffffff
	left_bg #ffffff
	left_fg #000000
	right_bg #d3e5fa
	right_fg #0a246a
	footer_gradient "0:#3a80f3 0.5:#2163d8 1:#1a4fb8"
	footer_fg #ffffff
	hl_bg #316ac5
	hl_fg #ffffff
	border #1c52b8
}

tooltip {
	bg #ffffe1
	fg #000000
	border #000000
}

alttab {
	bg #1b56c8f0
	fg #ffffff
	selection #ffffff50
	radius 6
}

pointer {
	locate yes
	locate_color #ffffffff
}

snap {
	color #b9d1f850
}

# Colors of the dark color scheme (tilewin-theme scheme dark)
dark {
	menu {
		bg #2b2b2b
		fg #f0f0f0
		hl_bg #316ac5
		hl_fg #ffffff
		disabled_fg #8a8a8a
		border #555555
		sidebar #333333
		field_bg #1f1f1f
		field_fg #f0f0f0
	}
	flyout {
		bg #2b2b2b
		fg #f0f0f0
		disabled_fg #9a9a9a
		inner_border #1c3f8a
		link #8fb6ff
		field_bg #1f1f1f
		field_fg #f0f0f0
	}
	startmenu {
		left_bg #2b2b2b
		left_fg #f0f0f0
		right_bg #1f3050
		right_fg #d3e5fa
	}
	tooltip { bg #2b2b2b; fg #f0f0f0; border #808080 }
}
