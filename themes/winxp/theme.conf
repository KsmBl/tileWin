# tileWin theme: Windows XP (Luna blue)

name "Windows XP"
style winxp

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #5a9be8
}

icons {
	theme hicolor
}

decoration {
	top_height 30
	maximized_top_height 26
	border_width 4
	corner_radius 8
	grab_margin 3
	title_font "Trebuchet MS, Noto Sans Bold 10"
	active {
		title_gradient "0:#3d8df5 0.06:#0a66f7 0.14:#0055e9 0.45:#0058ee 0.72:#005ef4 0.88:#0463f8 0.95:#0851db 1:#0842c1"
		title_fg #ffffff
		title_shadow #0a1883
		frame #0831d9
		frame_dark #001ea0
		frame_light #166aee
	}
	inactive {
		title_gradient "0:#a8c1f0 0.1:#7e9ae2 0.5:#7c97e0 0.9:#8ea8e6 1:#7c93d6"
		title_fg #d8e4f8
		frame #7b97e0
	}
}

panel {
	height 30
	font "Tahoma, Noto Sans 8"
	bold_font "Tahoma, Noto Sans Bold 8"
	bg_gradient "0:#3168d5 0.05:#4993e6 0.12:#2157d7 0.9:#2663e0 1:#1941a5"
	fg #ffffff
	alignment left
	padding 0
	style luna
}

taskbar {
	icons_only no
	button_width 160
	button_style luna
	radius 3
	fg #ffffff
	active_fg #ffffff
	bg_gradient "0:#3c81f3 0.5:#3574ee 1:#2d6ae6"
	hover_gradient "0:#53a0ff 0.5:#4a8ffb 1:#4282f5"
	active_gradient "0:#1e52b7 0.5:#1f4fb2 1:#2459c6"
	border #1a48b0
}

start {
	style xp
	label "start"
	width 100
	font "Trebuchet MS, Noto Sans Bold Italic 12"
	fg #ffffff
	bg_gradient "0:#3c9a3c 0.1:#62b862 0.5:#379f37 0.9:#2e8a2e 1:#256d25"
	hover_gradient "0:#4cb14c 0.1:#78ce78 0.5:#45b545 0.9:#3aa13a 1:#2e862e"
}

tray {
	style xp
	bg_gradient "0:#0c59b9 0.05:#18a0f4 0.12:#1290e8 0.9:#0d8de5 1:#0a62c3"
	border #1047a8
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Tahoma, Noto Sans 8"
	bg #ffffff
	fg #000000
	hl_bg #316ac5
	hl_fg #ffffff
	disabled_fg #aca899
	border #8a867a
	sidebar #fcfcf9
	radius 0
	item_height 22
	icon_size 16
}

startmenu {
	layout twocolumn
	width 380
	height 470
	radius 7
	header_gradient "0:#1868ce 0.1:#3a8ef3 0.9:#2468d4 1:#1e5bc0"
	header_fg #ffffff
	left_bg #ffffff
	left_fg #000000
	right_bg #d3e5fa
	right_fg #0a246a
	footer_gradient "0:#3a80f3 0.5:#2163d8 1:#1a4fb8"
	footer_fg #ffffff
	hl_bg #316ac5
	hl_fg #ffffff
	border #1c52b8
}

tooltip {
	bg #ffffe1
	fg #000000
	border #000000
}

alttab {
	bg #1b56c8f0
	fg #ffffff
	selection #ffffff50
	radius 6
}

snap {
	color #b9d1f850
}
