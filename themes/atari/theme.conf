# tileWin theme: the GEM desktop of the Atari ST (TOS 1, 1985) in medium
# resolution colour: the green desktop, the white menu bar along the top of the
# screen with its titles inverted while open, white drop-down menus outlined in
# black, windows with a black frame, the close box on the left of the title bar
# and the full box on the right, the bar of the active window dotted, alert
# boxes with a double border and the default button drawn thicker. No bevels,
# no gradients, no shadows that are not black: everything is black lines on
# white. The pixel font is Terminus (terminus-font) when installed.
#
# The dark colour scheme is the monochrome monitor turned round: white lines on
# black.
#
# All of it is drawn by tileWin from these colours; no artwork of Atari's is
# used.
inherit win95

name "Atari ST"
style atari

wallpaper {
	type solid
	color #00c000
}

icons {
	theme hicolor
	set atari
}

# the outlines of everything the classic look draws as bevels: one black line
decoration {
	top_height 20
	maximized_top_height 20
	border_width 1
	grab_margin 4
	title_height 19
	title_font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace Bold 10"
	face #ffffff
	highlight #000000
	light #ffffff
	shadow #ffffff
	dark #000000
	glyph #000000
	active {
		title_bg #ffffff
		title_fg #000000
		frame #000000
	}
	inactive {
		title_bg #ffffff
		title_fg #000000
		frame #000000
	}
}

# the menu bar of GEM along the top: Desk on the left, then the windows as the
# titles of the menu bar, the clock and the tray on the right
layout {
	window {
		position top
		height 22
		left start taskbar
		right tray keyboard volume network bluetooth battery clock notifications
	}
	tile {
		position top
		height 22
		left start workspaces title
		right tray cpu memory volume network bluetooth battery clock modeswitch
	}
}

panel {
	height 22
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bold_font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace Bold 10"
	bg #ffffff
	fg #000000
	border_top #000000
	border_top2 #ffffff
	alignment left
	padding 0
	style classic
}

taskbar {
	icons_only no
	button_width 150
	fg #000000
	active_fg #ffffff
	bg #ffffff
	active_bg #000000
	indicator #000000
}

start {
	style classic
	label "Desk"
	width 48
	fg #000000
	icon none
}

tray {
	style flat
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
	fg #000000
}

menu {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bold_font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace Bold 10"
	bg #ffffff
	fg #000000
	hl_bg #000000
	hl_fg #ffffff
	disabled_fg #808080
	border #000000
	field_bg #ffffff
	field_fg #000000
	separator #000000
	radius 0
	item_height 18
	icon_size 16
}

flyout {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bg #ffffff
	border #000000
	chart_bg #ffffff
	chart_grid #000000
	chart_line #000000
	chart_charging #000000
	bar #000000
	link #000000
	accent #000000
	boost #000000
}

startmenu {
	layout desk
	width 220
	banner_width 0
	large_icons no
	item_height 18
}

tooltip {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bg #ffffff
	fg #000000
	border #000000
	radius 0
}

alttab {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bg #ffffff
	fg #000000
	selection #000000
	border #000000
	radius 0
}

notifications {
	bg #ffffff
	fg #000000
	border #000000
}

osd {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bg #ffffff
	fg #000000
	border #000000
	accent #000000
}

dialog {
	bg #ffffff
	fg #000000
	heading_fg #000000
	field_bg #ffffff
	field_fg #000000
	field_border #000000
	button_fg #000000
}

shutdown {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	fg #000000
	border #000000
	accent #000000
	button_bg #ffffff
	hover_bg #000000
}

search {
	bg #ffffff
	fg #000000
	hover_bg #ffffff
}

desktop_widget {
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	bg #ffffff
	fg #000000
	dim #000000
	border #000000
	accent #000000
	accent2 #000000
	track #ffffff
	grid #000000
	face #ffffff
	warning #000000
	critical #000000
	radius 0
}

workspaces {
	active_bg #000000
	active_fg #ffffff
	radius 0
}

text {
	selection_bg #000000
	selection_fg #ffffff
}

snap {
	color #00000040
}

taskview {
	accent #000000
	font "Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace 10"
	radius 0
}

accent {
	color #000000
}

# Colors of the dark color scheme: the monochrome monitor turned round
dark {
	icons { dir icons-dark }
	wallpaper { color #000000 }
	decoration {
		face #000000
		highlight #ffffff
		light #000000
		shadow #000000
		dark #ffffff
		glyph #ffffff
		active { title_bg #000000; title_fg #ffffff; frame #ffffff }
		inactive { title_bg #000000; title_fg #ffffff; frame #ffffff }
	}
	panel { bg #000000; fg #ffffff; border_top #ffffff; border_top2 #000000 }
	taskbar { fg #ffffff; active_fg #000000; bg #000000; active_bg #ffffff; indicator #ffffff }
	start { fg #ffffff }
	clock { fg #ffffff }
	menu {
		bg #000000
		fg #ffffff
		hl_bg #ffffff
		hl_fg #000000
		disabled_fg #808080
		border #ffffff
		field_bg #000000
		field_fg #ffffff
		separator #ffffff
	}
	flyout {
		bg #000000; border #ffffff; chart_bg #000000; chart_grid #ffffff; chart_line #ffffff
		chart_charging #ffffff; bar #ffffff; link #ffffff; accent #ffffff; boost #ffffff
	}
	tooltip { bg #000000; fg #ffffff; border #ffffff }
	alttab { bg #000000; fg #ffffff; selection #ffffff; border #ffffff }
	notifications { bg #000000; fg #ffffff; border #ffffff }
	osd { bg #000000; fg #ffffff; border #ffffff; accent #ffffff }
	dialog {
		bg #000000; fg #ffffff; heading_fg #ffffff; field_bg #000000; field_fg #ffffff
		field_border #ffffff; button_fg #ffffff
	}
	shutdown { fg #ffffff; border #ffffff; accent #ffffff; button_bg #000000; hover_bg #ffffff }
	search { bg #000000; fg #ffffff; hover_bg #000000 }
	desktop_widget {
		bg #000000; fg #ffffff; dim #ffffff; border #ffffff; accent #ffffff; accent2 #ffffff
		track #000000
		grid #ffffff; face #000000; warning #ffffff; critical #ffffff
	}
	workspaces { active_bg #ffffff; active_fg #000000 }
	text { selection_bg #ffffff; selection_fg #000000 }
	accent { color #ffffff }
	taskview { accent #ffffff }
}
