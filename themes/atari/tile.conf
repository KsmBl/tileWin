# Tile mode look for the Atari ST theme (plain sway commands): black frames on
# white, the title bar of the focused window inverted.
font pango:Terminus, Fixedsys Excelsior, Liberation Mono, DejaVu Sans Mono, Monospace Bold 10
titlebar_padding 4 2
titlebar_border_thickness 1
default_border normal 1
default_floating_border normal 1

# class                 border  backgr. text    indicator child_border
client.focused          #000000 #000000 #ffffff #000000   #000000
client.focused_inactive #000000 #ffffff #000000 #ffffff   #000000
client.unfocused        #000000 #ffffff #000000 #ffffff   #000000
client.urgent           #000000 #ffffff #000000 #000000   #000000
