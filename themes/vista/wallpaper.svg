<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <title>tileWin Vista theme wallpaper: an aurora of green and blue light over dark (original artwork)</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0" stop-color="#16705a"/>
      <stop offset="0.55" stop-color="#0a3a28"/>
      <stop offset="1" stop-color="#010806"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cff9a" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#5cffb0" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#a8ff7a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3cff9a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa8ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#4ac0ff" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#30e0d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <path d="M-100 760 C 300 520, 640 900, 1000 640 S 1700 420, 2020 560 L 2020 700 C 1700 560, 1300 820, 1000 780 S 300 700, -100 900 Z" fill="url(#green)"/>
    <path d="M-100 620 C 400 420, 760 760, 1140 520 S 1760 360, 2020 440 L 2020 520 C 1700 470, 1400 680, 1100 640 S 400 560, -100 720 Z" fill="url(#blue)"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <path d="M-50 700 C 320 520, 660 860, 1010 650 S 1680 450, 1980 560" stroke="#c8ffe0" stroke-opacity="0.8" stroke-width="5"/>
    <path d="M-50 640 C 380 470, 760 740, 1130 560 S 1760 400, 1980 470" stroke="#bfefff" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M100 820 C 500 640, 820 920, 1180 720 S 1720 560, 1960 640" stroke="#9affc8" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
