# tileWin theme: Windows Vista: the glass of Windows 7 a shade smokier, a
# taskbar of black glass with the titles of the windows on its buttons, the
# dark Start orb and a Start menu framed in dark glass, under an aurora.
# Note: without background blur the glass is translucent only.
inherit win7

name "Windows Vista"
style win7

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #0b2a1e
}

icons {
	theme hicolor
	set win7
}

decoration {
	glass_gloss "0:#ffffff70 0.45:#ffffff28 1:#ffffff06"
	active {
		glass #5a7899e0
		title_fg #000000
		title_glow #ffffff50
		frame_outer #000000b0
	}
	inactive {
		glass #a7b7c8d8
		title_fg #202020c0
		title_glow #ffffff30
		frame_outer #00000070
	}
}

# the black glass of the Vista taskbar
panel {
	height 30
	bg_gradient "0:#4a4a4ae8 0.5:#262626ec 0.52:#050505f0 1:#141414f0"
	border_top #ffffff50
	border_top2 #000000a0
	fg #ffffff
}

taskbar {
	icons_only no
	button_width 160
	radius 2
	running_gradient "0:#ffffff28 0.5:#ffffff10 0.51:#00000020 1:#ffffff10"
	hover_gradient "0:#ffffff48 0.5:#ffffff24 0.51:#ffffff10 1:#a0d8ff40"
	active_gradient "0:#ffffff58 0.5:#ffffff30 0.51:#ffffff18 1:#a0d8ff60"
	border #ffffff40
}

start {
	style orb
	width 48
	bg_gradient "0:#c8e4ff 0.45:#2a5a90 0.5:#08203f 1:#2a6ab0"
	hover_gradient "0:#e2f2ff 0.45:#3c78b8 0.5:#123260 1:#4a90d8"
}

clock {
	format "%H:%M"
}

flyout {
	frame #101820e8
	accent #3399ff
}

startmenu {
	glass #101820e8
	right_fg #ffffff
}

alttab {
	bg #2a3440e8
	wash #050a10cc
}

dark {
	decoration {
		active { glass #24323ee8; title_fg #ffffff; title_glow #00000040 }
		inactive { glass #3a444edc; title_fg #c8d0d8c0; title_glow #00000030 }
	}
	flyout { frame #101820e8 }
}
