# tileWin theme: Windows 3.x: navy title bars with the title in the middle,
# the control-menu box on the left and arrow buttons on the right, thick grey
# sizing borders notched at the corners, and flat white menus.
inherit win95

name "Windows 3"
style win3

wallpaper {
	type image
	image wallpaper.svg
	mode tile
	color #1c3c58
}

decoration {
	top_height 24
	maximized_top_height 19
	border_width 4
	grab_margin 2
	title_font "MS Sans Serif, Noto Sans Bold 8"
	face #c0c0c0
	highlight #ffffff
	shadow #808080
	dark #000000
	glyph #000000
	active {
		title_bg #000080
		title_fg #ffffff
		frame #c0c0c0
	}
	inactive {
		title_bg #ffffff
		title_fg #000000
		frame #ffffff
	}
}

panel {
	font "MS Sans Serif, Noto Sans 8"
	bold_font "MS Sans Serif, Noto Sans Bold 8"
	bg #c0c0c0
	fg #000000
	border_top #000000
	border_top2 #ffffff
}

start {
	label "Programs"
}

menu {
	font "MS Sans Serif, Noto Sans Bold 8"
	bg #ffffff
	fg #000000
	hl_bg #000080
	hl_fg #ffffff
	disabled_fg #808080
	border #000000
	field_bg #ffffff
	field_fg #000000
	item_height 20
}

flyout {
	bg #ffffff
	border #000000
	chart_bg #000000
	chart_grid #008000
	chart_line #00ff00
	bar #000080
	link #0000ff
}

# minimized windows lie as icons along the bottom of the desktop
desktop {
	minimized_icons yes
}

# the Program Manager, its program groups made from the apps' categories
startmenu {
	layout progman
	width 480
	height 340
	border #000000
}

tooltip {
	bg #ffffff
	fg #000000
	border #000000
}

alttab {
	bg #c0c0c0
	fg #000000
	selection #000080
}

dialog {
	bg #ffffff
	fg #000000
}

# Colors of the dark color scheme: the same shapes in greys
dark {
	decoration {
		face #3c3c3c
		highlight #6e6e6e
		shadow #202020
		dark #000000
		glyph #e0e0e0
		active { title_bg #000060; title_fg #ffffff; frame #3c3c3c }
		inactive { title_bg #2c2c2c; title_fg #b0b0b0; frame #2c2c2c }
	}
	panel { bg #3c3c3c; fg #e0e0e0; border_top #000000; border_top2 #6e6e6e }
	menu {
		bg #2c2c2c
		fg #e0e0e0
		hl_bg #000080
		hl_fg #ffffff
		disabled_fg #7a7a7a
		border #000000
		field_bg #1f1f1f
		field_fg #e0e0e0
	}
	flyout { bg #2c2c2c; link #8fa8ff; bar #3a5fd0; accent #3a5fd0 }
	tooltip { bg #2c2c2c; fg #e0e0e0; border #000000 }
	alttab { bg #3c3c3c; fg #e0e0e0 }
	dialog { bg #2c2c2c; fg #e0e0e0 }
}
