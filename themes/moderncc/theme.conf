# tileWin theme: modernCC, "command & context". An experiment in a faster way to
# work: one place to start anything, the Command Center (Super, or the capsule at
# the left of the bar), which finds apps, open windows, settings, actions, files
# and sums as you type and shows what you use most before you type at all; a slim
# bar of three floating capsules along the top (what to do, what is in front, how
# things are), which leaves the bottom of the screen to the windows; and quiet
# windows, their title in the middle and three small round buttons.
#
# Light, with a dark scheme. An original design.
inherit win11

name "modernCC"
style cc
scheme light

icons {
	theme hicolor
	set win11
}

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #e9ecf5
}

decoration {
	top_height 38
	maximized_top_height 34
	border_width 1
	corner_radius 12
	grab_margin 10
	title_font "Inter, Cantarell, Noto Sans, Sans Semi-Bold 10"
	shadow #00000040
	active {
		title_bg #f6f7f9
		title_fg #1b1d22
		frame #00000033
		glyph #00000026
	}
	inactive {
		title_bg #eef0f3
		title_fg #8a8f99
		frame #00000022
		glyph #00000026
	}
}

panel {
	height 46
	# a floating bar of three capsules: what to do, what is in front, how things are
	margin 8
	margin_side 10
	bg #00000000
	groups yes
	group_bg #ffffffd9
	group_border #0000000f
	group_radius 16
	group_inset 4
	group_padding 6
	item_padding 10
	item_inset 6
	item_radius 12
	font "Inter, Cantarell, Noto Sans 10"
	bold_font "Inter, Cantarell, Noto Sans Semi-Bold 10"
	fg #1b1d22
	border_top #00000000
	alignment left
	style fluent
}

taskbar {
	icons_only yes
	button_width 38
	fg #1b1d22
	active_fg #1b1d22
	hover_bg #0000000a
	active_bg #5b6cf026
	indicator #5b6cf0
	indicator_inactive #6b7280
	indicator_height 3
	indicator_style pill
}

search {
	style box
	label "Do anything…   Super"
	width 230
	radius 16
	inset 4
	bg #00000008
	fg #6b7280
	glyph #6b7280
	hover_bg #0000000a
}

clock {
	format "%a %d %b  %H:%M"
	tooltip_format "%A, %d %B %Y"
	fg #1b1d22
}

title {
	fg #1b1d22
}

menu {
	font "Inter, Cantarell, Noto Sans 10"
	bold_font "Inter, Cantarell, Noto Sans Semi-Bold 10"
	bg #fbfbfdf5
	fg #1b1d22
	hl_bg #5b6cf026
	hl_fg #1b1d22
	disabled_fg #6b7280
	border #00000014
	field_bg #00000008
	field_fg #1b1d22
	separator #00000014
	radius 14
	item_height 34
	icon_size 18
}

commandcenter {
	field_font "Inter, Cantarell, Noto Sans 15"
}

flyout {
	bg #fbfbfdf5
	fg #1b1d22
	border #00000014
	radius 16
	chart_bg #00000008
	chart_grid #00000014
	chart_line #5b6cf0
	bar #5b6cf0
	link #5b6cf0
	accent #5b6cf0
}

startmenu {
	# no menu to look through: the Command Center, to type into
	layout command
}

tooltip {
	bg #fbfbfdf5
	fg #1b1d22
	border #00000014
	radius 10
}

alttab {
	bg #fbfbfdf5
	fg #1b1d22
	selection #5b6cf026
	border #00000014
	radius 18
}

notifications {
	bg #fbfbfdf5
	fg #1b1d22
	border #00000014
}

osd {
	bg #fbfbfdf5
	fg #1b1d22
	border #00000014
	accent #5b6cf0
}

dialog {
	bg #f6f7f9
	fg #1b1d22
	heading_fg #1b1d22
	field_bg #00000008
	field_fg #1b1d22
	field_border #00000014
}

desktop_widget {
	look fluent
	bg #ffffffd9
	bg2 #ffffffd9
	fg #1b1d22
	dim #6b7280
	border #0000000f
	accent #5b6cf0
	accent2 #2bb3a3
	track #00000014
	grid #00000014
	radius 18
}

workspaces {
	active_bg #5b6cf026
	active_fg #1b1d22
	radius 10
}

taskview {
	accent #5b6cf0
	radius 18
}

text {
	selection_bg #5b6cf0
	selection_fg #ffffff
}

snap {
	color #5b6cf026
}

accent {
	color #5b6cf0
}

# the bar along the top: the Command Center's capsule and the running apps,
# the window in front in the middle, how things are on the right
layout {
	window {
		position top
		height 46
		left search taskbar
		center title
		right tray keyboard network volume battery notifications clock
	}
	tile {
		position top
		height 46
		left search workspaces
		center title
		right tray network volume battery notifications clock
	}
}

