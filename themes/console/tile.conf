# Tile mode look for the Starship Console theme (plain sway commands): black,
# the focused window framed in orange, the others in lilac.
font pango:Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, Sans Condensed Bold 11
titlebar_padding 10 3
titlebar_border_thickness 0
default_border normal 3
default_floating_border normal 3
gaps inner 6

# class                 border  backgr. text    indicator child_border
client.focused          #a5a6ff #a5a6ff #000000 #d3d6ff   #a5a6ff
client.focused_inactive #cc99cc #cc99cc #000000 #cc99cc   #cc99cc
client.unfocused        #6a5070 #6a5070 #000000 #6a5070   #6a5070
client.urgent           #e0606a #e0606a #000000 #e0606a   #e0606a
