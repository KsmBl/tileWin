# tileWin theme: Starship Console, a look in the spirit of the touch screens of
# science fiction starships: black, everything framed by thick bars in soft
# orange, peach, lilac and blue with round ends, joined at the corners by
# elbows, the words in narrow capitals, the buttons rounded blocks of colour.
# An original design; it uses no names, logos or artwork of any film or series.
#
# Its colours are the same in the light and the dark scheme: it is dark.
inherit win10

name "Starship Console"
style console
scheme dark

wallpaper {
	type solid
	color #000000
}

icons {
	theme hicolor
	set console
}

decoration {
	top_height 30
	maximized_top_height 26
	border_width 3
	grab_margin 6
	title_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	face #000000
	glyph #000000
	active {
		title_bg #ff9c3a
		title_fg #ff9c3a
		frame #ff9c3a
		accent #c896d8
	}
	inactive {
		title_bg #7a5a3c
		title_fg #a08060
		frame #7a5a3c
		accent #6a5070
	}
	button {
		hover #ffffff40
		pressed #00000040
	}
}

# the bar along the bottom: MENU at its round left end, the clock at its round
# right end
layout {
	window {
		position bottom
		height 40
		left start taskbar
		right tray keyboard volume network bluetooth battery notifications clock
	}
}

# the colours of the blocks, in the order the console takes them
palette {
	colors "#ff9c3a #ffcf99 #c896d8 #8f9bff #8fc8ff #e8c070 #d4707a"
}

panel {
	height 40
	font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed 11"
	bold_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	bg #000000
	fg #ffcf99
	border_top #000000
	border_top2 #000000
	alignment left
	style flat
}

taskbar {
	icons_only no
	button_width 170
	fg #000000
	active_fg #000000
	bg #8f9bff
	active_bg #ff9c3a
	indicator #ff9c3a
}

start {
	label "MENU"
	width 100
	fg #000000
	bg #ff9c3a
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
	fg #000000
}

menu {
	font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed 11"
	bold_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	bg #000000
	fg #ffcf99
	hl_bg #ff9c3a
	hl_fg #000000
	disabled_fg #806850
	border #ff9c3a
	field_bg #1a1208
	field_fg #ffcf99
	separator #ff9c3a
	radius 14
	item_height 26
	icon_size 16
}

flyout {
	bg #000000
	fg #ffcf99
	border #ff9c3a
	radius 14
	chart_bg #000000
	chart_grid #3a2a50
	chart_line #ff9c3a
	chart_charging #8fc8ff
	bar #ff9c3a
	link #8fc8ff
	accent #ff9c3a
	boost #d4707a
}

startmenu {
	layout blocks
	width 240
	banner_width 0
	large_icons no
	item_height 28
}

tooltip {
	bg #000000
	fg #ffcf99
	border #c896d8
	radius 10
}

alttab {
	bg #000000
	fg #ffcf99
	selection #ff9c3a60
	border #ff9c3a
	radius 18
}

notifications {
	bg #000000
	fg #ffcf99
	border #8f9bff
}

osd {
	bg #000000
	fg #ffcf99
	border #ff9c3a
	accent #ff9c3a
}

dialog {
	bg #000000
	fg #ffcf99
	heading_fg #ff9c3a
	field_bg #1a1208
	field_fg #ffcf99
	field_border #ff9c3a
	button_fg #000000
}

shutdown {
	fg #ffcf99
	border #ff9c3a
	accent #ff9c3a
	button_bg #8f9bff
	hover_bg #ff9c3a
}

search {
	bg #1a1208
	fg #ffcf99
	glyph #ff9c3a
	hover_bg #2a1e10
}

desktop_widget {
	look flat
	bg #000000
	bg2 #000000
	fg #ffcf99
	dim #c896d8
	border #ff9c3a
	accent #ff9c3a
	accent2 #8fc8ff
	track #3a2a50
	grid #3a2a50
	face #000000
	warning #e8c070
	critical #d4707a
	radius 16
}

workspaces {
	active_bg #ff9c3a
	active_fg #000000
	radius 12
}

taskview {
	accent #ff9c3a
	radius 18
}

text {
	selection_bg #ff9c3a
	selection_fg #000000
}

snap {
	color #ff9c3a40
}

accent {
	color #ff9c3a
}


