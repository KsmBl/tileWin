# tileWin theme: Starship Console, a look in the spirit of the touch screens of
# science fiction starships: black, everything framed by thick bars in soft
# orange, peach, lilac and blue with round ends, joined at the corners by
# elbows, the words in narrow capitals, the buttons rounded blocks of colour.
# An original design; it uses no names, logos or artwork of any film or series.
#
# Its colours are the same in the light and the dark scheme: it is dark.
inherit win10

name "Starship Console"
style console
scheme dark

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #000000
}

icons {
	theme hicolor
	set console
}

decoration {
	top_height 36
	maximized_top_height 32
	border_width 3
	grab_margin 6
	title_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	face #000000
	glyph #000000
	active {
		title_bg #a5a6ff
		title_fg #a5a6ff
		frame #a5a6ff
		accent #cc99cc
	}
	inactive {
		title_bg #3d4266
		title_fg #8088c0
		frame #3d4266
		accent #3d4266
	}
	button {
		hover #ffffff40
		pressed #00000040
	}
}

# the bar along the bottom: MENU at its round left end, the clock at its round
# right end
layout {
	window {
		position bottom
		height 40
		left start taskbar
		right tray keyboard volume network bluetooth battery notifications clock
	}
}

# the colours of the blocks, in the order the console takes them
palette {
	colors "#a5a6ff #ffaa90 #cc99cc #6688cc #99ccff #ffcc99 #cc6699"
}

panel {
	height 40
	font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed 11"
	bold_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	bg #000000
	fg #d3d6ff
	border_top #000000
	border_top2 #000000
	alignment left
	style flat
}

taskbar {
	icons_only no
	button_width 170
	fg #000000
	active_fg #000000
	bg #6688cc
	active_bg #a5a6ff
	indicator #a5a6ff
}

start {
	label "MENU"
	width 100
	fg #000000
	bg #a5a6ff
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
	fg #000000
}

menu {
	font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed 11"
	bold_font "Antonio, Oswald, Nimbus Sans Narrow, Liberation Sans Narrow, DejaVu Sans Condensed, Sans Condensed Bold 11"
	bg #000000
	fg #d3d6ff
	hl_bg #a5a6ff
	hl_fg #000000
	disabled_fg #6a6f9a
	border #a5a6ff
	field_bg #0e1124
	field_fg #d3d6ff
	separator #a5a6ff
	radius 14
	item_height 26
	icon_size 16
}

flyout {
	bg #000000
	fg #d3d6ff
	border #a5a6ff
	radius 14
	chart_bg #000000
	chart_grid #2a2f55
	chart_line #a5a6ff
	chart_charging #99ccff
	bar #a5a6ff
	link #99ccff
	accent #a5a6ff
	boost #e0606a
}

startmenu {
	layout blocks
	width 240
	banner_width 0
	large_icons no
	item_height 32
}

tooltip {
	bg #000000
	fg #d3d6ff
	border #cc99cc
	radius 10
}

alttab {
	bg #000000
	fg #d3d6ff
	selection #a5a6ff60
	border #a5a6ff
	radius 18
}

notifications {
	bg #000000
	fg #d3d6ff
	border #6688cc
}

osd {
	bg #000000
	fg #d3d6ff
	border #a5a6ff
	accent #a5a6ff
}

dialog {
	bg #000000
	fg #d3d6ff
	heading_fg #a5a6ff
	field_bg #0e1124
	field_fg #d3d6ff
	field_border #a5a6ff
	button_fg #000000
}

shutdown {
	fg #d3d6ff
	border #a5a6ff
	accent #a5a6ff
	button_bg #6688cc
	hover_bg #a5a6ff
}

search {
	bg #0e1124
	fg #d3d6ff
	glyph #a5a6ff
	hover_bg #1a1f3a
}

desktop_widget {
	look flat
	bg #000000
	bg2 #000000
	fg #d3d6ff
	dim #cc99cc
	border #a5a6ff
	accent #a5a6ff
	accent2 #99ccff
	track #2a2f55
	grid #2a2f55
	face #000000
	warning #ffcc99
	critical #e0606a
	radius 16
}

workspaces {
	active_bg #a5a6ff
	active_fg #000000
	radius 12
}

taskview {
	accent #a5a6ff
	radius 18
}

text {
	selection_bg #a5a6ff
	selection_fg #000000
}

snap {
	color #a5a6ff40
}

accent {
	color #a5a6ff
}


