# tileWin theme: Windows XP (dark), the Luna look in black: the same glossy
# title bars, taskbar and Start menu, in black and greys instead of blue.
inherit winxp

name "Windows XP (dark)"
style winxp
# dark in itself: apps go dark while it is on, whatever scheme is chosen
scheme dark

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #0b0f18
}

decoration {
	active {
		title_gradient "0:#6a6a6a 0.06:#3a3a3a 0.14:#1c1c1c 0.45:#202020 0.72:#262626 0.88:#2c2c2c 0.95:#161616 1:#080808"
		title_fg #ffffff
		title_shadow #000000
		title_highlight #8a8a8a
		frame #1a1a1a
		frame_dark #000000
		frame_light #404040
	}
	inactive {
		title_gradient "0:#8a8a8a 0.1:#5e5e5e 0.5:#585858 0.9:#626262 1:#4e4e4e"
		title_fg #c8c8c8
		title_highlight #a0a0a0
		frame #555555
		frame_dark #3a3a3a
		frame_light #6e6e6e
	}
	button {
		normal "0:#7a7a7a 0.5:#3c3c3c 1:#262626"
		hover "0:#9a9a9a 0.5:#5a5a5a 1:#3c3c3c"
		pressed "0:#141414 1:#444444"
		inactive_normal "0:#8a8a8a 1:#666666"
		inactive_hover "0:#9a9a9a 1:#707070"
		inactive_pressed "0:#555555 1:#777777"
	}
}

panel {
	bg_gradient "0:#3a3a3a 0.05:#6a6a6a 0.12:#1e1e1e 0.9:#242424 1:#050505"
	fg #ffffff
}

taskbar {
	fg #ffffff
	active_fg #ffffff
	bg_gradient "0:#555555 0.5:#444444 1:#383838"
	hover_gradient "0:#707070 0.5:#5e5e5e 1:#525252"
	active_gradient "0:#141414 0.5:#191919 1:#242424"
	border #0a0a0a
	indicator #8a8a8a
}

tray {
	bg_gradient "0:#0a0a0a 0.05:#4a4a4a 0.12:#2e2e2e 0.9:#2a2a2a 1:#101010"
	border #000000
}

menu {
	bg #262626
	fg #f0f0f0
	hl_bg #4a4a4a
	hl_fg #ffffff
	disabled_fg #8a8a8a
	border #000000
	sidebar #2e2e2e
	field_bg #1a1a1a
	field_fg #f0f0f0
}

flyout {
	bg #262626
	fg #f0f0f0
	disabled_fg #9a9a9a
	border #000000
	frame_gradient "0:#6a6a6a 0.1:#2e2e2e 0.9:#1c1c1c 1:#080808"
	inner_border #555555
	accent #3d9a3d
	link #b8c8e0
	bar #3d9a3d
	field_bg #1a1a1a
	field_fg #f0f0f0
}

startmenu {
	header_gradient "0:#1a1a1a 0.1:#5a5a5a 0.9:#2a2a2a 1:#101010"
	header_fg #ffffff
	left_bg #262626
	left_fg #f0f0f0
	right_bg #333333
	right_fg #e8e8e8
	footer_gradient "0:#4a4a4a 0.5:#262626 1:#0e0e0e"
	footer_fg #ffffff
	hl_bg #4a4a4a
	hl_fg #ffffff
	right_hl_bg #4a4a4a
	divider #555555
	separator #555555
	dim #9a9a9a
	border #000000
}

tooltip {
	bg #262626
	fg #f0f0f0
	border #000000
}

alttab {
	bg #1a1a1af0
	fg #ffffff
	selection #ffffff40
}

snap {
	color #ffffff30
}

shutdown {
	header_bg #141414
	footer_bg #141414
	line_gradient "0:#3a3a3a 0.35:#9a9a9a 1:#2a2a2a"
	middle_gradient "0:#4a4a4a 0.45:#363636 1:#262626"
}

# the Run and "not responding" dialogs
dialog {
	bg #2a2a2a
	fg #f0f0f0
	heading_fg #ffffff
	field_bg #1a1a1a
	field_fg #f0f0f0
	field_border #5a5a5a
	button_gradient "0:#5a5a5a 0.5:#444444 0.51:#3a3a3a 1:#303030"
	button_fg #f0f0f0
	button_border #1a1a1a
	default_border #8a8a8a
}

desktop_widget {
	bg #2e2e2e
	bg2 #161616
	fg #f0f0f0
	dim #9a9a9a
	border #000000
	track #444444
	grid #3a3a3a
	face #1a1a1a
	accent #8a8a8a
	accent2 #3d9a3d
}

# The theme is dark in both schemes: the dark one keeps the same colors
# (Windows XP's own dark block would bring blue back).
dark {
	menu {
		bg #262626
		fg #f0f0f0
		hl_bg #4a4a4a
		hl_fg #ffffff
		disabled_fg #8a8a8a
		border #000000
		sidebar #2e2e2e
		field_bg #1a1a1a
		field_fg #f0f0f0
	}
	flyout {
		bg #262626
		fg #f0f0f0
		disabled_fg #9a9a9a
		inner_border #555555
		link #b8c8e0
		field_bg #1a1a1a
		field_fg #f0f0f0
	}
	startmenu {
		left_bg #262626
		left_fg #f0f0f0
		right_bg #333333
		right_fg #e8e8e8
	}
	tooltip { bg #262626; fg #f0f0f0; border #000000 }
}
