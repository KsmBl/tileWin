# tileWin theme: Windows 95 / classic
# Colors are #rrggbb or #rrggbbaa, gradients are "offset:color ..." lists.

name "Windows 95"
style win95

wallpaper {
	type solid
	color #008080
}

icons {
	theme hicolor
}

decoration {
	top_height 23
	maximized_top_height 19
	border_width 4
	grab_margin 2
	title_height 18
	title_font "Tahoma, MS Sans Serif, Noto Sans Bold 8"
	face #c0c0c0
	highlight #ffffff
	light #dfdfdf
	shadow #808080
	dark #000000
	glyph #000000
	active {
		title_gradient "0:#000080 1:#1084d0"
		title_fg #ffffff
	}
	inactive {
		title_gradient "0:#808080 1:#b5b5b5"
		title_fg #c0c0c0
	}
}

panel {
	height 28
	font "Tahoma, MS Sans Serif, Noto Sans 8"
	bold_font "Tahoma, MS Sans Serif, Noto Sans Bold 8"
	bg #c0c0c0
	fg #000000
	border_top #dfdfdf
	border_top2 #ffffff
	alignment left
	padding 2
	style classic
}

taskbar {
	icons_only no
	button_width 160
	button_style bevel
	fg #000000
	active_fg #000000
	bg #c0c0c0
	active_bg #e0e0e0
}

start {
	style classic
	label "Start"
	width 54
	fg #000000
}

tray {
	style sunken
}

clock {
	format "%H:%M"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Tahoma, MS Sans Serif, Noto Sans 8"
	bg #c0c0c0
	fg #000000
	hl_bg #000080
	hl_fg #ffffff
	disabled_fg #808080
	border bevel
	radius 0
	item_height 22
	icon_size 16
}

startmenu {
	layout classic
	width 200
	banner_gradient "0:#000080 1:#1084d0"
	banner_text "tileWin"
	banner_width 22
	large_icons yes
	item_height 32
}

tooltip {
	bg #ffffe1
	fg #000000
	border #000000
}

alttab {
	bg #c0c0c0
	fg #000000
	selection #000080
	radius 0
}

snap {
	color #80808060
}

# Colors of the dark color scheme (tilewin-theme scheme dark)
dark {
	decoration {
		face #3c3c3c
		highlight #6e6e6e
		light #545454
		shadow #202020
		dark #000000
		glyph #e0e0e0
		inactive { title_fg #9a9a9a }
	}
	panel { bg #3c3c3c; fg #e0e0e0; border_top #545454; border_top2 #6e6e6e }
	taskbar { fg #e0e0e0; active_fg #ffffff; bg #3c3c3c; active_bg #2c2c2c }
	start { fg #e0e0e0 }
	menu {
		bg #3c3c3c
		fg #e0e0e0
		hl_bg #000080
		hl_fg #ffffff
		disabled_fg #7a7a7a
		field_bg #1f1f1f
		field_fg #e0e0e0
	}
	tooltip { bg #3c3c3c; fg #e0e0e0; border #000000 }
	alttab { bg #3c3c3c; fg #e0e0e0 }
}
