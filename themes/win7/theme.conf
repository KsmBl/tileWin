# tileWin theme: Windows 7 (Aero)
# Note: without background blur the glass is translucent only.

name "Windows 7"
style win7

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #1c6fc0
}

icons {
	theme hicolor
}

decoration {
	top_height 30
	maximized_top_height 22
	border_width 8
	corner_radius 6
	title_font "Segoe UI, Noto Sans 9"
	glass_gloss "0:#ffffff80 0.45:#ffffff30 1:#ffffff08"
	active {
		glass #8fb4dae8
		title_fg #000000
		title_glow #ffffff40
		frame_outer #000000a0
	}
	inactive {
		glass #c6d7e9dc
		title_fg #202020c0
		title_glow #ffffff30
		frame_outer #00000060
	}
}

panel {
	height 40
	font "Segoe UI, Noto Sans 9"
	bold_font "Segoe UI, Noto Sans Bold 9"
	bg_gradient "0:#1c2a3ae0 0.5:#172433e0 0.52:#0d1826e8 1:#0b1522ec"
	border_top #ffffff40
	border_top2 #00000080
	fg #ffffff
	alignment left
	padding 0
	style aero
}

taskbar {
	icons_only yes
	button_width 60
	button_style aero
	radius 3
	fg #ffffff
	active_fg #ffffff
	running_gradient "0:#ffffff30 0.5:#ffffff18 0.51:#ffffff08 1:#ffffff20"
	hover_gradient "0:#ffffff50 0.5:#ffffff30 0.51:#ffffff18 1:#8fd0ff50"
	active_gradient "0:#ffffff60 0.5:#ffffff38 0.51:#ffffff20 1:#8fd0ff70"
	border #ffffff50
}

start {
	style orb
	width 54
	fg #ffffff
	bg_gradient "0:#8dd1ff 0.45:#2b7fd0 0.5:#0f4f98 1:#3aa2e8"
	hover_gradient "0:#b5e3ff 0.45:#4aa0ec 0.5:#1f6fc0 1:#6cc3ff"
}

tray {
	style aero
}

clock {
	format "%H:%M\n%d.%m.%Y"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Segoe UI, Noto Sans 9"
	bg #f0f0f0
	fg #000000
	hl_bg #d9e8fb
	hl_fg #000000
	hl_border #aecff7
	disabled_fg #6d6d6d
	border #979797
	sidebar #f1f1f1
	radius 3
	item_height 24
	icon_size 16
}

startmenu {
	layout twocolumn
	width 400
	height 520
	radius 6
	glass #1f3c5ce0
	left_bg #ffffff
	left_fg #000000
	right_bg #00000000
	right_fg #ffffff
	search_bg #ffffff
	search_fg #6d6d6d
	hl_bg #d9e8fb
	hl_fg #000000
	border #00000090
}

tooltip {
	bg #f7f8fb
	fg #575757
	border #767676
}

alttab {
	bg #6d93bce8
	fg #ffffff
	selection #ffffff38
	radius 6
}

snap {
	color #cfe3ff50
}
