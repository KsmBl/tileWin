# tileWin theme: Windows 10

name "Windows 10"
style win10

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #03143a
}

icons {
	# fallback for icons the theme does not draw itself (icons/)
	theme hicolor
	set win10
}

decoration {
	top_height 31
	maximized_top_height 30
	border_width 1
	grab_margin 6
	button_width 46
	title_font "Segoe UI, Noto Sans 9"
	shadow #00000028
	active {
		title_bg #ffffff
		title_fg #000000
		frame #1f6fc5d0
		glyph #000000
	}
	inactive {
		title_bg #ffffff
		title_fg #999999
		frame #aaaaaa
		glyph #999999
	}
	button {
		hover #e5e5e5
		pressed #cccccc
	}
	close {
		hover #e81123
		pressed #f1707a
	}
}

panel {
	height 40
	font "Segoe UI, Noto Sans 9"
	bold_font "Segoe UI, Noto Sans Bold 9"
	bg #101010f0
	fg #ffffff
	alignment left
	padding 0
	style flat
}

taskbar {
	icons_only yes
	button_width 48
	button_style flat
	fg #ffffff
	active_fg #ffffff
	hover_bg #ffffff1f
	active_bg #ffffff29
	indicator #76b9ed
	indicator_height 2
	indicator_style full
}

start {
	style win10
	width 48
	fg #ffffff
	hover_bg #ffffff1f
	hover_fg #0a84ff
}

search {
	width 300
	bg #f2f2f2
	fg #6b6b6b
	label "Type here to search"
}

tray {
	icons symbolic
	style flat
}

clock {
	format "%H:%M\n%d.%m.%Y"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Segoe UI, Noto Sans 9"
	bg #f2f2f2
	fg #000000
	hl_bg #dadada
	hl_fg #000000
	disabled_fg #a0a0a0
	border #cccccc
	radius 0
	item_height 32
	icon_size 16
}

startmenu {
	layout list
	width 360
	height 560
	radius 0
	bg #1f1f1ff2
	fg #ffffff
	strip_bg #1a1a1af2
	header_fg #ffffff
	hl_bg #ffffff1f
	hl_fg #ffffff
	search_bg #ffffff
	search_fg #000000
	border #00000000
}

tooltip {
	bg #2b2b2b
	fg #ffffff
	border #767676
}

alttab {
	bg #1f1f1fe8
	fg #ffffff
	selection #ffffff38
	radius 0
}

snap {
	color #d0e4ff40
}

# Colors of the dark color scheme (tilewin-theme scheme dark)
dark {
	decoration {
		active { title_bg #202020; title_fg #ffffff; glyph #ffffff }
		inactive { title_bg #2b2b2b; title_fg #8a8a8a; glyph #8a8a8a }
		button { hover #3b3b3b; pressed #555555 }
	}
	search { bg #3a3a3a; hover_bg #474747; fg #c8c8c8; glyph #e0e0e0 }
	menu {
		bg #2b2b2b
		fg #ffffff
		hl_bg #414141
		hl_fg #ffffff
		disabled_fg #7a7a7a
		border #3f3f3f
		field_bg #1f1f1f
		field_fg #ffffff
	}
	tooltip { bg #2b2b2b; fg #ffffff; border #767676 }
	snap { color #ffffff30 }
}
