<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <title>tileWin 10 theme wallpaper: light beams and a glowing pane (original artwork)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010511"/>
      <stop offset="0.55" stop-color="#021534"/>
      <stop offset="1" stop-color="#04214f"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fb8ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#1a6fe6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0a3a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="1300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9ad6ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#3f95ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1b5fd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f1ff"/>
      <stop offset="0.35" stop-color="#77c6ff"/>
      <stop offset="1" stop-color="#1f7cf2"/>
    </linearGradient>
    <filter id="blurHuge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurBeam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <ellipse cx="1330" cy="580" rx="760" ry="540" fill="url(#core)" filter="url(#blurHuge)"/>

  <g filter="url(#blurBeam)">
    <polygon points="1290,420 -40,-60 -40,210" fill="url(#beam)" opacity="0.55"/>
    <polygon points="1290,520 -40,300 -40,520" fill="url(#beam)" opacity="0.45"/>
    <polygon points="1290,640 -40,640 -40,880" fill="url(#beam)" opacity="0.5"/>
    <polygon points="1290,740 -40,1000 -40,1260" fill="url(#beam)" opacity="0.55"/>
    <polygon points="1320,780 300,1260 700,1260" fill="url(#beam)" opacity="0.35"/>
  </g>

  <polygon points="1190,370 1520,300 1520,860 1190,790" fill="#6fc2ff" opacity="0.75"
           filter="url(#blurGlow)"/>
  <polygon points="1190,370 1520,300 1520,860 1190,790" fill="url(#pane)" opacity="0.95"/>
  <polygon points="1190,370 1520,300 1520,330 1190,392" fill="#ffffff" opacity="0.35"/>

  <ellipse cx="1330" cy="1060" rx="780" ry="110" fill="#1a66dc" opacity="0.35"
           filter="url(#blurHuge)"/>
</svg>
