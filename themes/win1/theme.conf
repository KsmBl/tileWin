# tileWin theme: Windows 1.0 as it looked on EGA: bright blue title bars with
# the title white on black in the middle, a white system box on the left and
# the zoom box on the right, yellow menus, and the cyan of the icon area along
# the bottom of the screen. Its windows did not overlap: tile mode fits it.
inherit win3

name "Windows 1"
style win1

wallpaper {
	type solid
	color #55ffff
}

decoration {
	top_height 21
	maximized_top_height 20
	border_width 1
	grab_margin 4
	title_font "Fixedsys Excelsior, Terminus, DejaVu Sans Mono, Monospace Bold 9"
	face #ffffff
	dark #000000
	title_box #000000
	active {
		title_bg #5555ff
		title_fg #ffffff
		frame #000000
	}
	inactive {
		title_bg #5555ff
		title_fg #ffffff
		frame #000000
		dither #ffffff
	}
}

# the icon area of Windows 1: the bottom of the screen, where the running
# programs lay as icons
panel {
	font "Fixedsys Excelsior, Terminus, DejaVu Sans Mono, Monospace 9"
	bold_font "Fixedsys Excelsior, Terminus, DejaVu Sans Mono, Monospace Bold 9"
	bg #55ffff
	fg #000000
	border_top #000000
	border_top2 #55ffff
}

start {
	label "Executive"
}

menu {
	font "Fixedsys Excelsior, Terminus, DejaVu Sans Mono, Monospace Bold 9"
	bg #ffff55
	fg #000000
	hl_bg #5555ff
	hl_fg #ffff55
	disabled_fg #555555
	border #000000
	field_bg #ffffff
	field_fg #000000
}

flyout {
	bg #ffffff
	border #000000
	chart_bg #000000
	chart_grid #0000aa
	chart_line #55ffff
	bar #5555ff
	link #0000aa
	accent #5555ff
}

# a plain menu of the programs, in the yellow of the menus, rather than the
# Program Manager of Windows 3
startmenu {
	layout classic
}

tooltip {
	bg #ffff55
	fg #000000
	border #000000
}

alttab {
	bg #ffffff
	fg #000000
	selection #5555ff
}

dialog {
	bg #ffffff
	fg #000000
}

# Colors of the dark color scheme: the EGA colors, darker
dark {
	wallpaper { color #005555 }
	decoration {
		face #aaaaaa
		active { title_bg #0000aa; title_fg #ffffff }
		inactive { title_bg #0000aa; title_fg #aaaaaa; dither #000000 }
	}
	panel { bg #005555; fg #ffffff; border_top #000000; border_top2 #005555 }
	menu {
		bg #1f1f1f
		fg #ffff55
		hl_bg #0000aa
		hl_fg #ffff55
		disabled_fg #7a7a7a
		border #000000
		field_bg #000000
		field_fg #ffffff
	}
	flyout { bg #1f1f1f; link #55ffff; bar #5555ff; accent #5555ff }
	tooltip { bg #1f1f1f; fg #ffff55; border #000000 }
	alttab { bg #1f1f1f; fg #ffffff }
	dialog { bg #1f1f1f; fg #ffffff }
}
