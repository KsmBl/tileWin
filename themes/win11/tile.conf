# Tile mode look for the Windows 11 theme (plain sway commands).
font pango:Segoe UI Variable Text, Segoe UI, Noto Sans 9
titlebar_padding 12 8
titlebar_border_thickness 1
default_border normal 1
default_floating_border normal 1

