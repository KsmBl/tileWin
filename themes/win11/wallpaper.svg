<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <title>tileWin 11 theme wallpaper: blue bloom (original artwork)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafa"/>
      <stop offset="0.5" stop-color="#a9cbf1"/>
      <stop offset="1" stop-color="#6c9fe3"/>
    </linearGradient>
    <linearGradient id="petalDark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a2f94"/>
      <stop offset="0.5" stop-color="#1f62d6"/>
      <stop offset="1" stop-color="#6fb2ff"/>
    </linearGradient>
    <linearGradient id="petalMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1446b8"/>
      <stop offset="0.55" stop-color="#3a86f0"/>
      <stop offset="1" stop-color="#a7d3ff"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a66d8"/>
      <stop offset="0.6" stop-color="#6fb0ff"/>
      <stop offset="1" stop-color="#e2f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <path id="petal" d="M0 0 C -150 -110 -190 -360 0 -500 C 190 -360 150 -110 0 0 Z"/>
    <path id="curl" d="M0 -40 C -90 -150 -110 -320 0 -440"/>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <ellipse cx="960" cy="760" rx="520" ry="200" fill="#1c4fb0" opacity="0.28" filter="url(#shadow)"/>

  <g transform="translate(960 760)" filter="url(#soft)">
    <use href="#petal" fill="url(#petalDark)" transform="rotate(-78) scale(0.95)" opacity="0.92"/>
    <use href="#petal" fill="url(#petalDark)" transform="rotate(78) scale(0.95)" opacity="0.92"/>
    <use href="#petal" fill="url(#petalMid)" transform="rotate(-46) scale(1.02)" opacity="0.94"/>
    <use href="#petal" fill="url(#petalMid)" transform="rotate(46) scale(1.02)" opacity="0.94"/>
    <use href="#petal" fill="url(#petalLight)" transform="rotate(-16) scale(1.08)" opacity="0.95"/>
    <use href="#petal" fill="url(#petalLight)" transform="rotate(16) scale(1.08)" opacity="0.95"/>
    <use href="#petal" fill="url(#petalMid)" transform="scale(0.78 0.9)" opacity="0.97"/>

    <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.35">
      <use href="#curl" transform="rotate(-46) scale(1.02)"/>
      <use href="#curl" transform="rotate(46) scale(1.02)"/>
      <use href="#curl" transform="rotate(-16) scale(1.08)"/>
      <use href="#curl" transform="rotate(16) scale(1.08)"/>
    </g>
  </g>
</svg>
