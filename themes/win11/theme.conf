# tileWin theme: Windows 11 (light)

name "Windows 11"
style win11

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #a9cbf1
}

icons {
	theme hicolor
}

decoration {
	top_height 33
	maximized_top_height 32
	border_width 1
	corner_radius 8
	grab_margin 8
	button_width 46
	title_font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	shadow #00000030
	active {
		title_bg #f3f3f3
		title_fg #000000
		frame #00000055
		glyph #000000
	}
	inactive {
		title_bg #fafafa
		title_fg #8c8c8c
		frame #00000030
		glyph #8c8c8c
	}
	button {
		hover #0000000f
		pressed #0000000a
	}
	close {
		hover #c42b1c
		pressed #c83c30
	}
}

panel {
	height 48
	font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	bold_font "Segoe UI Variable Text, Segoe UI, Noto Sans Bold 9"
	bg #eeeeeef2
	border_top #00000018
	fg #000000
	alignment center
	padding 0
	style fluent
}

taskbar {
	icons_only yes
	button_width 44
	button_style fluent
	radius 4
	fg #000000
	active_fg #000000
	hover_bg #0000000d
	active_bg #00000014
	indicator #005fb8
	indicator_inactive #8a8a8a
	indicator_height 3
	indicator_style pill
}

start {
	style win11
	width 44
	fg #000000
	hover_bg #0000000d
}

tray {
	style flat
}

clock {
	format "%H:%M\n%d.%m.%Y"
	tooltip_format "%A, %d %B %Y"
	align right
}

menu {
	font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	bg #f9f9f9
	fg #000000
	hl_bg #0000000f
	hl_fg #000000
	disabled_fg #a0a0a0
	border #00000024
	radius 8
	item_height 32
	icon_size 16
}

startmenu {
	layout centered
	width 640
	height 700
	radius 8
	bg #f2f2f2f5
	fg #000000
	header_fg #000000
	hl_bg #0000000f
	hl_fg #000000
	search_bg #ffffff
	search_fg #5f5f5f
	footer_bg #e7e7e7f5
	border #00000026
}

tooltip {
	bg #f9f9f9
	fg #000000
	border #00000033
}

alttab {
	bg #202020e0
	fg #ffffff
	selection #ffffff38
	radius 8
}

snap {
	color #ffffff50
}

# Colors of the dark color scheme (tilewin-theme scheme dark)
dark {
	decoration {
		active { title_bg #202020; title_fg #ffffff; frame #ffffff30; glyph #ffffff }
		inactive { title_bg #2b2b2b; title_fg #9d9d9d; frame #ffffff1a; glyph #9d9d9d }
		button { hover #ffffff14; pressed #ffffff0d }
	}
	panel { bg #1c1c1cf2; border_top #ffffff14; fg #ffffff }
	taskbar {
		fg #ffffff
		active_fg #ffffff
		hover_bg #ffffff0f
		active_bg #ffffff14
		indicator #60cdff
		indicator_inactive #9d9d9d
	}
	start { fg #ffffff; hover_bg #ffffff0f }
	menu {
		bg #2c2c2c
		fg #ffffff
		hl_bg #ffffff14
		hl_fg #ffffff
		disabled_fg #787878
		border #ffffff1f
		field_bg #1f1f1f
		field_fg #ffffff
	}
	startmenu {
		bg #242424f5
		fg #ffffff
		header_fg #ffffff
		hl_bg #ffffff14
		hl_fg #ffffff
		search_bg #1f1f1f
		search_fg #cfcfcf
		footer_bg #1c1c1cf5
		border #ffffff1f
	}
	tooltip { bg #2c2c2c; fg #ffffff; border #ffffff26 }
	snap { color #ffffff30 }
}
