# tileWin theme: Windows 11 (light)

name "Windows 11"
style win11

wallpaper {
	type gradient
	color #7fa9e8
	color2 #dce8f8
	direction vertical
}

icons {
	theme hicolor
}

decoration {
	top_height 33
	maximized_top_height 32
	border_width 1
	corner_radius 8
	grab_margin 8
	button_width 46
	title_font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	shadow #00000030
	active {
		title_bg #f3f3f3
		title_fg #000000
		frame #00000055
		glyph #000000
	}
	inactive {
		title_bg #fafafa
		title_fg #8c8c8c
		frame #00000030
		glyph #8c8c8c
	}
	button {
		hover #0000000f
		pressed #0000000a
	}
	close {
		hover #c42b1c
		pressed #c83c30
	}
}

panel {
	height 48
	font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	bold_font "Segoe UI Variable Text, Segoe UI, Noto Sans Bold 9"
	bg #eeeeeef2
	border_top #00000018
	fg #000000
	alignment center
	padding 0
	style fluent
}

taskbar {
	icons_only yes
	button_width 44
	button_style fluent
	radius 4
	fg #000000
	active_fg #000000
	hover_bg #0000000d
	active_bg #00000014
	indicator #005fb8
	indicator_inactive #8a8a8a
	indicator_height 3
	indicator_style pill
}

start {
	style win11
	width 44
	fg #000000
	hover_bg #0000000d
}

tray {
	style flat
}

clock {
	format "%H:%M\n%d.%m.%Y"
	tooltip_format "%A, %d %B %Y"
	align right
}

menu {
	font "Segoe UI Variable Text, Segoe UI, Noto Sans 9"
	bg #f9f9f9
	fg #000000
	hl_bg #0000000f
	hl_fg #000000
	disabled_fg #a0a0a0
	border #00000024
	radius 8
	item_height 32
	icon_size 16
}

startmenu {
	layout centered
	width 640
	height 700
	radius 8
	bg #f2f2f2f5
	fg #000000
	header_fg #000000
	hl_bg #0000000f
	hl_fg #000000
	search_bg #ffffff
	search_fg #5f5f5f
	footer_bg #e7e7e7f5
	border #00000026
}

tooltip {
	bg #f9f9f9
	fg #000000
	border #00000033
}

alttab {
	bg #202020e0
	fg #ffffff
	selection #ffffff38
	radius 8
}

snap {
	color #ffffff50
}
