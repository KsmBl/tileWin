# tileWin theme: Windows 8

name "Windows 8"
style win8

wallpaper {
	type image
	image wallpaper.svg
	mode fill
	color #180052
}

icons {
	# the Windows 10 icons; fallback for icons they don't draw
	theme hicolor
	set win10
}

decoration {
	top_height 30
	maximized_top_height 22
	border_width 8
	grab_margin 2
	button_width 26
	close_width 45
	button_height 20
	title_font "Segoe UI, Noto Sans 9"
	active {
		title_bg #6ba5e7
		title_fg #000000
		frame #4f84c0
		glyph #000000
	}
	inactive {
		title_bg #ebebeb
		title_fg #999999
		frame #aaaaaa
		glyph #999999
	}
	button {
		hover #ffffff50
		pressed #00000030
	}
	close {
		normal #c75050
		hover #e04343
		pressed #993d3d
	}
}

# Windows 8 has no search box on the taskbar: the start screen searches
layout {
	window {
		position bottom
		left start taskbar
		right tray keyboard volume network battery clock notifications showdesktop
	}
}

panel {
	height 40
	font "Segoe UI, Noto Sans 9"
	bold_font "Segoe UI, Noto Sans Bold 9"
	bg #2a4f82d9
	fg #ffffff
	alignment left
	padding 0
	style flat
}

taskbar {
	icons_only yes
	button_width 60
	button_style flat
	fg #ffffff
	active_fg #ffffff
	hover_bg #ffffff26
	active_bg #ffffff38
	indicator #ffffff90
	indicator_height 2
	indicator_style full
}

start {
	style win10
	width 48
	fg #ffffff
	hover_bg #ffffff26
	hover_fg #ffffff
}

tray {
	icons symbolic
	style flat
}

clock {
	format "%H:%M\n%d.%m.%Y"
	tooltip_format "%A, %d %B %Y"
}

menu {
	font "Segoe UI, Noto Sans 9"
	bg #ffffff
	fg #000000
	hl_bg #d5e8f7
	hl_fg #000000
	disabled_fg #a0a0a0
	border #979797
	radius 0
	item_height 28
	icon_size 16
}

# The start screen: tiles of the pinned apps over the whole screen
startmenu {
	layout tiles
	bg #180052
	fg #ffffff
	hl_bg #ffffff26
	hl_fg #ffffff
	search_bg #ffffff
	search_fg #000000
	title_font "Segoe UI Light, Noto Sans Light 32"
	tile_colors "#2672ec #00a300 #dc572e #8c0095 #00aba9 #ac193d #2e8def #d24726 #5133ab"
}

notifications {
	bg #2d3e8cf4
	fg #ffffff
	border #2d3e8c
}

tooltip {
	bg #ffffff
	fg #575757
	border #767676
}

alttab {
	bg #1f1f1fe8
	fg #ffffff
	selection #6ba5e780
	radius 0
}

snap {
	color #6ba5e750
}

# Colors of the dark color scheme (tilewin-theme scheme dark)
dark {
	decoration {
		active { title_bg #1f4e80; title_fg #ffffff; frame #16385c; glyph #ffffff }
		inactive { title_bg #2b2b2b; title_fg #8a8a8a; frame #3f3f3f; glyph #8a8a8a }
		button { hover #ffffff26; pressed #00000040 }
	}
	menu {
		bg #2b2b2b
		fg #ffffff
		hl_bg #3e5f85
		hl_fg #ffffff
		disabled_fg #7a7a7a
		border #3f3f3f
		field_bg #1f1f1f
		field_fg #ffffff
	}
	tooltip { bg #2b2b2b; fg #ffffff; border #767676 }
}
