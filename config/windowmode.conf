# tileWin window mode configuration.
# Same syntax as sway's config. Every shortcut below can be changed or
# removed; the tileWin-specific commands are documented in the README.

include common.conf

set $mod Mod4

focus_follows_mouse no
focus_on_window_activation focus
floating_modifier $mod normal
default_border normal 1
default_floating_border normal 1

### Start menu and launching
# Tapping the Windows key opens the start menu.
bindsym --release Super_L panel startmenu toggle
bindsym --release Super_R panel startmenu toggle
bindsym Control+Escape panel startmenu toggle
bindsym $mod+r panel run
# Search and launch apps (see launcher_command in common.conf)
bindsym $mod+s launcher
bindsym $mod+i exec tilewin-settings
bindsym $mod+e exec $filemanager
bindsym $mod+Return exec $term
bindsym Control+Shift+Escape exec $taskmanager
bindsym $mod+l exec $locker

### Windows
bindsym Mod1+F4 kill
bindsym Mod1+Tab alttab next
bindsym Mod1+Shift+Tab alttab prev
# Task view: all windows and desktops, drag windows to other desktops
bindsym $mod+Tab taskview
bindsym $mod+Up snap up
bindsym $mod+Down snap down
bindsym $mod+Left snap left
bindsym $mod+Right snap right
bindsym $mod+d showdesktop
bindsym $mod+m showdesktop
bindsym $mod+Shift+Left move output left
bindsym $mod+Shift+Right move output right
bindsym Mod1+space panel window_menu

### Taskbar: Win+1..9 activates the n-th taskbar entry
bindsym $mod+1 panel activate 1
bindsym $mod+2 panel activate 2
bindsym $mod+3 panel activate 3
bindsym $mod+4 panel activate 4
bindsym $mod+5 panel activate 5
bindsym $mod+6 panel activate 6
bindsym $mod+7 panel activate 7
bindsym $mod+8 panel activate 8
bindsym $mod+9 panel activate 9

### Virtual desktops (workspaces)
bindsym $mod+Control+d desktop new
bindsym $mod+Control+F4 desktop close
bindsym $mod+Control+Left workspace prev_on_output
bindsym $mod+Control+Right workspace next_on_output
bindsym $mod+Control+Shift+Left move container to workspace prev_on_output, workspace prev_on_output
bindsym $mod+Control+Shift+Right move container to workspace next_on_output, workspace next_on_output

### Screenshots
bindsym Print exec $screenshot

### tileWin
# Switch to tile mode (sway-like tiling).
bindsym $mod+Shift+w wm_mode toggle
bindsym $mod+Shift+c reload
# Restart the whole window manager, e.g. after installing an update.
bindsym $mod+Shift+Control+r restart
bindsym $mod+Shift+Control+p restart panel
bindsym Control+Mod1+Delete exec tilewin-nag -t warning -m 'Log out of tileWin?' -B 'Log out' 'tilewinmsg exit'
