# tileWin taskbar configuration
#
# Syntax: sway-style blocks. Statements end at a newline or ';'.
# The file is reloaded automatically when saved.
# Colors, fonts and sizes come from the active theme (tilewin-theme set ...);
# everything set here overrides the theme.
#
# Commands used by on_click, menu items etc. are tileWin/sway commands, e.g.
#   exec <program>      start a program
#   arrange cascade     any compositor command
#   panel <action>      taskbar actions: startmenu, run, calendar, reload,
#                       activate <n>, window_menu, menu <name>

# font "Noto Sans 10"
# outputs *                       # or a list of output names
terminal "xfce4-terminal -x"      # used for desktop entries with Terminal=true
tooltip_delay 600
# Icons of the files in ~/Desktop, with a right-click menu to create folders,
# documents and shortcuts
desktop_icons yes
# Size of the desktop grid: the picture, the cell it sits in and the margin
# around the whole grid, all in pixels.
# desktop_icon_size 48
# desktop_icon_width 100
# desktop_icon_height 100
# desktop_margin 10
# The clipboard history (Win+V) and whether picking an entry pastes it
# clipboard_history yes
# clipboard_paste yes
# Time servers the settings app asks for the time, and how it picks an answer:
# first, fastest or average
# time_servers "0.pool.ntp.org 1.pool.ntp.org time.cloudflare.com"
# time_server_mode first


# The git widget shows the branch, the newest tag and the changed lines of the
# repository the focused window is working in, and keeps the last one it saw on
# screen. Put "git" in a layout below to use it.
# widget git {
#     interval 5        # seconds between checks
#     show_tag yes
#     icon ""          # drawn before the branch, needs a Nerd Font
# }

# A theme may bring its own layouts; "no" keeps the ones below whichever theme
# is picked.
# theme_layout yes

#
# Layouts: one for window mode, one for tile mode.
# Sections: left, center, right. Widgets are listed by name; a name like
# "custom:weather" refers to a widget block below. The theme decides whether
# the left group is centered (Windows 11).
#
layout window {
	position bottom
	# height 40
	left start search taskbar
	right tray keyboard volume network battery clock notifications showdesktop
}

layout tile {
	position top
	height 26
	left workspaces title
	right tray cpu memory volume network battery clock modeswitch
}

#
# Widget settings. Every widget accepts:
#   on_click, on_middle_click, on_right_click, on_scroll_up, on_scroll_down
#   menu { ... }                  (right-click menu, see "menu taskbar" below)
#
widget taskbar {
	icons_only theme              # theme | yes | no
	# group yes                   # combine windows of the same app
	workspaces current            # current | all
	outputs current               # current | all | main (all on the main display)
	middle_click close            # close | new
	# max_width 160
}

widget clock {
	# format "%H:%M"              # strftime format, "\n" for two lines
	tooltip_format "%A, %d %B %Y"
	# on_click panel calendar     # clock, calendar and the link below
	# settings "exec tilewin-settings --page datetime"   # the link of the flyout
}

widget cpu {
	interval 2
	format "CPU {usage}%"
	# style graph
}

widget memory {
	interval 5
	format "RAM {used_percent}%"  # {used} {total} in GiB
}

widget battery {
	interval 30
	# format "{capacity}%"
}

widget network {
	interval 5
	# interface wlan0
}

widget volume {
	mixer "exec pavucontrol"
	step 5
}

widget search {
	# label "Type here to search"
	# width 300
}

widget quicklaunch {
	item xfce4-terminal.desktop
	item thunar.desktop
}

# Custom script widgets: add "custom:weather" to a layout to show them.
widget custom:weather {
	exec "curl -sf 'https://wttr.in/?format=%c+%t' || echo n/a"
	interval 900
	on_click exec xdg-open https://wttr.in
}

widget custom:uptime {
	exec "uptime -p | sed 's/^up //'"
	interval 60
	format "up {}"
}

# Example of a streaming script, one line (or JSON object) per update:
# widget custom:mpd {
#     exec_listen "~/bin/mpd-status.sh"
#     on_click exec mpc toggle
# }

#
# Widgets on the desktop. Every taskbar widget can sit there too, on a card of
# its own in the grid of the desktop icons. Its "widget <name>" block above
# sets it up for both places; what its entry here says is only for the desktop.
# Drag a card to move it from cell to cell.
#   style       compact (like on the taskbar, default) or tile for every widget;
#               chart, gauge, ring and bar for the meters (cpu, memory, gpu,
#               net, storage, power); ring, gauge and bar for volume, network,
#               battery and brightness; chart for the disk lamp; digital,
#               analog and binary for the clock
#   column, row the cell of its upper left corner, from 0; negative numbers
#               count from the right and the bottom (-1 is the last column).
#               Without them it goes to the upper right corner
#   size        cells it takes, columns x rows, e.g. 3x2 (the style decides)
#   seconds     yes | no: the analog and binary clock show the seconds
#   output      main (the main display, default), all, or a screen name
#   background  yes | no: the card behind it
# A second widget of the same kind gets a name of its own, e.g. clock:analog.
#
# desktop_widgets {
#     clock { style analog; column -1; row 0 }
#     cpu { style chart; column -3; row 2 }
#     power { style chart; size 3x2 }
#     custom:weather { column -1; row 4 }
# }

#
# The screen saver: which one tilewin-screensaver shows. When it starts is
# "idle_timeout screensaver <seconds>" in common.conf (the Screen saver page
# of the settings sets both). tilewin-screensaver --list shows the names:
# blank, bubbles, mystify, ribbons, text3d, photos, starfield, pipes, maze,
# flyingwindows, aurora, wordclock, tiling, diggers, matrix, hellfire,
# microslop, thunderstorm, or random.
#
# screensaver {
#     name aurora
#     speed 1               # 0.25 to 4
#     text "tileWin"        # 3D Text: the words, or time for the clock
#     photos ~/Pictures     # Photos: the folder of the slideshow
#     photo_seconds 8
#
#     # each saver's own settings, "<saver>_<setting> <value>"; left out is the
#     # first value (or for yes/no the one marked default)
#     bubbles_count normal         # normal, few, many
#     bubbles_size normal          # normal, small, large
#     mystify_shapes two           # two, one
#     mystify_trail normal         # normal, short, long
#     ribbons_ribbons five         # five, three, one
#     starfield_stars normal       # normal, sparse, dense
#     flyingwindows_windows normal # normal, few, many
#     pipes_joints mixed           # mixed, elbows, balls
#     pipes_pipes two              # two, one, three
#     pipes_teapot rarely          # rarely, often
#     maze_rats yes                # yes (default), no
#     maze_stones yes              # yes (default), no: the stones that turn it over
#     aurora_mood cpu              # cpu (follows the processor), calm, stormy
#     aurora_stars yes             # yes (default), no
#     wordclock_color white        # white, green, blue, amber, pink
#     tiling_windows nine          # nine, four, two: at most
#     diggers_miners normal        # normal, few, many
#     diggers_dynamite yes         # yes (default), no
#     diggers_renew two            # two, five (minutes), never
#     matrix_color green           # green, blue, red, amber, white
#     hellfire_flash yes           # yes (default), no: the white flash at the start
#     hellfire_debris yes          # yes (default), no: pieces falling down
#     hellfire_scraps some         # some, few, many: what is left smouldering
#     microslop_updates yes        # yes (default), no: "Updates are ready"
#     microslop_skip yes           # yes (default), no: the "Skip ad" button
#     thunderstorm_rain heavy      # heavy, light, downpour
#     thunderstorm_lightning sometimes # sometimes, often, rarely
#     thunderstorm_strikes yes     # yes (default), no: into the windows and the taskbar
# }

#
# Right-click menu of the empty taskbar area.
#   item "Label" [icon <name>] [disabled] [checked] [bold] <command>
#   separator
#   submenu "Label" { ... }
#
menu taskbar {
	item "Cascade windows" arrange cascade
	item "Show windows stacked" arrange vertical
	item "Show windows side by side" arrange horizontal
	item "Arrange windows optimally" arrange optimal
	separator
	item "Show the desktop" showdesktop
	separator
	submenu "Theme" {
		item "Windows 95" exec tilewin-theme set win95
		item "Windows XP" exec tilewin-theme set winxp
		item "Windows 7" exec tilewin-theme set win7
		item "Windows 8" exec tilewin-theme set win8
		item "Windows 10" exec tilewin-theme set win10
		item "Windows 11" exec tilewin-theme set win11
	}
	item "Switch tile/window mode" wm_mode toggle
	separator
	item "Task Manager" exec $taskmanager
	item "Taskbar settings" exec tilewin-settings --page taskbar
}

# Extra entries appended to the right-click menu of taskbar buttons.
# {id} is replaced by the window's con_id. Quote commands containing { or }.
menu window {
	item "Snap left" "[con_id={id}] snap left"
	item "Snap right" "[con_id={id}] snap right"
}

# Extra entries for the right-click menu of the empty desktop.
# menu desktop {
#     item "Open Firefox" exec firefox
# }

# Right-click menu of the start button.
menu start {
	item "Terminal" exec $term
	item "File Explorer" exec $filemanager
	item "Task Manager" exec $taskmanager
	item "Run..." panel run
	separator
	submenu "Shut down or sign out" {
		item "Lock" exec tilewin-lock -f
		item "Sign out" exit
		item "Restart tileWin" restart
		separator
		item "Restart" exec systemctl reboot
		item "Shut down" exec systemctl poweroff
	}
	item "Desktop" showdesktop
}

startmenu {
	# Style of the menu: theme (the one the current theme asks for), classic,
	# twocolumn, list, tiles or centered
	# layout theme

	# Pinned apps (desktop entry ids). Missing ones are skipped.
	pinned xfce4-terminal.desktop thunar.desktop org.xfce.mousepad.desktop firefox.desktop chromium.desktop libreoffice-startcenter.desktop gimp.desktop btop.desktop

	# Links in the right column / side strip: place "Label" <icon> <command>
	place "Home" user-home "exec xdg-open ~"
	place "Documents" folder-documents "exec xdg-open \"$(xdg-user-dir DOCUMENTS)\""
	place "Pictures" folder-pictures "exec xdg-open \"$(xdg-user-dir PICTURES)\""
	place "Music" folder-music "exec xdg-open \"$(xdg-user-dir MUSIC)\""
	place "Downloads" folder-download "exec xdg-open \"$(xdg-user-dir DOWNLOAD)\""
	place "Terminal" utilities-terminal "exec $term"
	place "Settings" preferences-system "exec tilewin-settings"

	# Power menu entries: power "Label" <command>
	power "Lock" "exec tilewin-lock -f"
	power "Sign out" "exit"
	power "Restart tileWin" "restart"
	# sleep: stand by in RAM; hibernate: to disk; hybrid sleep: both, so the
	# work survives when the battery runs out. Hidden where the computer
	# cannot do them.
	power "Sleep" "exec systemctl suspend"
	power "Hibernate" "exec systemctl hibernate"
	power "Hybrid sleep" "exec systemctl hybrid-sleep"
	power "Restart" "exec systemctl reboot"
	power "Shut down" "exec systemctl poweroff"
}
