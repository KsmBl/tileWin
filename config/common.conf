# tileWin: settings shared by tile mode and window mode.
# Both tilemode.conf and windowmode.conf include this file.
# Syntax is the same as sway's config (see `man 5 sway`).

### Programs
set $term xfce4-terminal
set $filemanager thunar
set $taskmanager xfce4-terminal -e btop
set $locker tilewin-lock -f
# Print: all screens to the clipboard and ~/Pictures/Screenshots (tilewin-snip area|window|screen)
set $screenshot tilewin-snip screen

### Animations
# Windows fade in and out, minimize to the taskbar and desktops slide.
# animations disable
# animation_speed 1.5

### Volume, brightness and media keys
# They run "tilewin-media <action>" (volume-up, mute, brightness-down,
# play-pause, ...) unless a binding here uses the same key, e.g.
#   bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+

### Outputs
# Example: output HDMI-A-1 resolution 1920x1080 position 1920,0 scale 1
# You can get the names of your outputs by running: tilewinmsg -t get_outputs

### Wallpaper
# wallpaper theme                                  (use the active theme's wallpaper)
# wallpaper solid #008080
# wallpaper gradient #245edb #9dc8f8 [vertical|horizontal]
# wallpaper image ~/Pictures/wall.png [fill|fit|stretch|center]
# wallpaper none                                   (e.g. when using swaybg)
wallpaper theme

### Inputs
# input type:keyboard {
#     xkb_layout de
# }
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}

### Application launcher
# "builtin" uses the tileWin launcher. Any other value is run as a command, e.g.
#   launcher_command rofi -show drun
#   launcher_command wofi --show drun
#   launcher_command fuzzel
launcher_command builtin

### Session
# Reopen the apps that were open at the last logout or shutdown on the same
# workspace and position. Apps bring back their own content (browser tabs,
# documents) when they support it. "no" starts with an empty desktop.
session_restore yes

### Taskbar
# The taskbar is started and supervised by tileWin. Its layout lives in
# ~/.config/tileWin/taskbar.conf. Use "panel_command none" to disable it.
panel_command tilewin-panel

### Autostart (runs once per session, not on reload/mode switch)
# exec nm-applet --indicator
