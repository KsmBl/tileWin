# Portal backends for tileWin sessions (XDG_CURRENT_DESKTOP=tileWin).
# The GTK portal provides settings such as the dark color scheme, file
# choosers and more; the wlr portal adds screenshots and screen sharing
# when xdg-desktop-portal-wlr is installed.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
