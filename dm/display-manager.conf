# The display manager of tileWin. The Login screen page of the settings writes
# this file; by hand, "tilewin-display-manager --check-config <file>" checks it.
# A line it cannot make sense of is left out, so it cannot keep anyone from
# logging in. See docs/configuration.md for every setting.
#
# theme follow                  # or the name of a theme
# color_scheme follow           # light, dark
# wallpaper theme               # or a picture every user can read, or #204070
# dim 30
# card_position center          # left, right
# clock top                     # bottom-left, bottom-right, none
# greeting "Ask Sam if you forgot your password"
# keyboard_layout de,us
# autologin_user sam
# env QT_QPA_PLATFORM=wayland
